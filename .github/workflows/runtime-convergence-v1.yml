name: Runtime convergence V1 regression

concurrency:
  group: runtime-convergence-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/personal-agent-runtime-convergence-v1
  pull_request:
    branches:
      - fix/browser-live-contracts-v2
  workflow_dispatch:

jobs:
  runtime-convergence:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check modified module and important runtime imports
        shell: pwsh
        run: |
          python -m py_compile jarvis_agent/runtime_convergence.py jarvis_agent/agent_runtime.py jarvis_agent/mission_context_store.py jarvis_agent/task_graph_store.py

      - name: Mission checkpoints and existing Python regressions
        shell: pwsh
        env:
          JARVIS_RUNTIME_CONVERGENCE_ENABLED: "0"
          JARVIS_CUA_DRIVER_ENABLED: "0"
        run: |
          python -m unittest tests.test_runtime_convergence tests.test_foundations_v4 tests.test_browser_dom_contract tests.test_agent_runtime tests.test_semantic_memory_v5 tests.test_assistant_v3 tests.test_windows_perception tests.test_tools tests.test_text_input_mode_v3 -q

      - name: Browser bridge replay tests
        shell: pwsh
        run: |
          node --test tests/browser_bridge_replay.mjs

  full-python-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audio and GUI system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libportaudio2 libasound2-dev libegl1

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run broad Python regressions
        env:
          QT_QPA_PLATFORM: offscreen
          JARVIS_RUNTIME_CONVERGENCE_ENABLED: "0"
          JARVIS_CUA_DRIVER_ENABLED: "0"
        run: |
          python - <<'PY'
          import sys
          import unittest

          # Exactly four historical tests assume Win32 APIs unavailable on
          # Linux. The same modules run on the Windows CI lane where supported.
          windows_only = {
              "test_learned_app_profile_is_reused_before_rescanning_windows",
              "test_cursor_falls_back_to_dynamic_windows_discovery",
              "test_inspection_recovers_from_uia_enumeration_failure",
              "test_named_inspection_prefers_stable_native_handle",
          }
          original = unittest.defaultTestLoader.discover(
              "tests", pattern="test_*.py"
          )
          omitted = []
          def filter_suite(items):
              kept = unittest.TestSuite()
              for item in items:
                  if isinstance(item, unittest.TestSuite):
                      kept.addTests(filter_suite(item))
                  elif item.id().split(".")[-1] in windows_only:
                      omitted.append(item.id())
                  else:
                      kept.addTest(item)
              return kept

          suite = filter_suite(original)
          print("Windows-only tests excluded on Linux:", omitted)
          assert len(omitted) == 4, "Unexpected platform skip set"
          outcome = unittest.TextTestRunner(verbosity=1).run(suite)
          sys.exit(0 if outcome.wasSuccessful() else 1)
          PY
