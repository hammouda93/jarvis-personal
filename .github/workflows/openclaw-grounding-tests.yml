name: OpenClaw grounding focused tests

on:
  push:
    branches:
      - feature/personal-jarvis-ui-v2-openclaw-grounding
      - feature/personal-jarvis-ui-v2-computer-use-recovery-v1
      - feature/visual-perception-fallback-v1
      - feature/computer-use-fusion-v2

jobs:
  focused-windows-tests:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install focused test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-dotenv pywinauto pillow numpy sounddevice PySide6==6.8.2.1
      - name: Compile changed runtime modules
        shell: pwsh
        run: |
          python -m py_compile jarvis_agent/cua_driver_bridge.py jarvis_agent/windows_perception.py jarvis_agent/screen_vision.py jarvis_agent/native_tools.py jarvis_agent/agent_runtime.py jarvis_agent/audio.py jarvis_agent/assistant_v3.py jarvis_agent/ui.py
          foreach ($file in @("scripts/run_jarvis_computer_use.ps1", "scripts/run_computer_use_validation.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Run focused unit tests
        shell: pwsh
        env:
          JARVIS_CUA_DRIVER_ENABLED: "0"
        run: |
          python -m unittest tests.test_cua_driver_bridge tests.test_windows_perception tests.test_native_tools tests.test_agent_runtime tests.test_screen_vision tests.test_perception_router tests.test_computer_use_engine tests.test_multi_surface_engine tests.test_kernel_foundations tests.test_architecture_extensions tests.test_assistant_v3 tests.test_ui_logging -v

  unknown-browser-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install optional browser test dependencies
        run: |
          python -m pip install python-dotenv pillow -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Test fusion and a fresh unknown browser fixture
        env:
          JARVIS_COMPATIBILITY_BASELINE: "1"
          JARVIS_CUA_DRIVER_ENABLED: "0"
        run: python -m unittest tests.test_computer_use_engine tests.test_multi_surface_engine tests.test_browser_adapter -v
