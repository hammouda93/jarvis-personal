name: OpenClaw grounding focused tests

on:
  push:
    branches:
      - feature/personal-jarvis-ui-v2-openclaw-grounding
      - feature/personal-jarvis-ui-v2-computer-use-recovery-v1
      - feature/visual-perception-fallback-v1

jobs:
  focused-windows-tests:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install focused test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-dotenv pywinauto pillow
      - name: Compile changed runtime modules
        shell: pwsh
        run: |
          python -m py_compile jarvis_agent/cua_driver_bridge.py jarvis_agent/windows_perception.py jarvis_agent/screen_vision.py jarvis_agent/native_tools.py jarvis_agent/agent_runtime.py
      - name: Run focused unit tests
        shell: pwsh
        env:
          JARVIS_CUA_DRIVER_ENABLED: "0"
        run: |
          python -m unittest tests.test_cua_driver_bridge tests.test_windows_perception tests.test_native_tools tests.test_agent_runtime tests.test_screen_vision -v
