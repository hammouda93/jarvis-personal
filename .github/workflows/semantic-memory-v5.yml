name: Semantic Memory V5

on:
  push:
    branches:
      - feature/semantic-memory-core-v5
  pull_request:
    branches:
      - checkpoint/foundations-v4-automated-green
  workflow_dispatch:

jobs:
  semantic-memory:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile semantic memory modules
        shell: pwsh
        run: |
          python -m py_compile jarvis_agent/semantic_memory.py jarvis_agent/memory_core_store.py jarvis_agent/memory_semantic_interpreter.py jarvis_agent/semantic_memory_runtime.py jarvis_agent/semantic_memory_cli.py jarvis_agent/foundation_tools.py jarvis_agent/agent_runtime.py scripts/evaluate_semantic_memory_v5.py

      - name: Run Semantic Memory V5 invariants
        shell: pwsh
        env:
          JARVIS_CUA_DRIVER_ENABLED: "0"
        run: |
          python -m unittest tests.test_semantic_memory_v5 -v

      - name: Run V4 memory and runtime non-regressions
        shell: pwsh
        env:
          JARVIS_CUA_DRIVER_ENABLED: "0"
        run: |
          python -m unittest tests.test_foundations_v4 tests.test_agent_runtime -v
