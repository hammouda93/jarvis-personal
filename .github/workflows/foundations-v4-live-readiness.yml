name: Foundations V4 live-readiness

on:
  push:
    branches:
      - fix/personal-agent-foundations-v4-live-readiness
  workflow_dispatch:

jobs:
  foundations-v4:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install runtime test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile V4 runtime modules
        shell: pwsh
        run: |
          python -m py_compile jarvis_agent/agent_runtime.py jarvis_agent/assistant_v3.py jarvis_agent/browser_core.py jarvis_agent/browser_native_host.py jarvis_agent/browser_bridge_doctor.py jarvis_agent/runtime_preflight.py jarvis_agent/computer_grounding.py jarvis_agent/fast_grounding.py jarvis_agent/foundation_tools.py jarvis_agent/memory_router.py jarvis_agent/memory_retrieval.py

      - name: Run V4 and critical historical Python tests
        shell: pwsh
        env:
          JARVIS_CUA_DRIVER_ENABLED: "0"
        run: |
          python -m unittest tests.test_foundations_v4 tests.test_agent_runtime tests.test_assistant_v3 tests.test_windows_perception tests.test_native_tools tests.test_tools -v

      - name: Run Browser Bridge replay tests
        shell: pwsh
        run: |
          node --test tests/browser_bridge_replay.mjs
